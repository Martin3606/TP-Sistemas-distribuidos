spring.application.name=backend-graphql
server.port=8080

# Misma base que usa el backend Python, apuntando al MySQL de Docker
spring.datasource.url=jdbc:mysql://localhost:3307/rentar
spring.datasource.username=rentar_user
spring.datasource.password=rentar_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate = Hibernate NO crea ni modifica tablas, solo chequea que las
# entidades @Entity coincidan con lo que ya existe (creado por db/init.sql).
# Es la diferencia clave con ddl-auto=update de tu TP anterior.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Habilita el playground para probar queries a mano en /graphiql
spring.graphql.graphiql.enabled=true

# Habilita CORS a nivel de Spring GraphQL para peticiones desde el frontend (React :5173)
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET, POST, OPTIONS
spring.graphql.cors.allowed-headers=*

