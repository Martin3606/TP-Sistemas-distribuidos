syntax = "proto3";

package rentar.customer.v1;

// Servicio encargado de gestionar todo lo relacionado con los clientes y su autenticacion
service CustomerService {
  // Valida las credenciales de ingreso y devuelve un token junto con el rol del usuario
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  
  // Trae el padron de clientes. Permite filtrar para traer unicamente los habilitados (activos)
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  
  // Obtiene la ficha completa de un cliente usando su ID interno de base de datos
  rpc GetCustomer(GetCustomerRequest) returns (CustomerResponse);
  
  // Busca un cliente por su DNI
  rpc GetCustomerByDocument(GetCustomerByDocumentRequest) returns (CustomerResponse);
  
  // Registra un nuevo cliente en el sistema
  rpc CreateCustomer(CreateCustomerRequest) returns (CustomerResponse);
  
  // Actualiza datos de un cliente
  // Es una actualización parcial, solo modifica los campos que se envian
  rpc UpdateCustomer(UpdateCustomerRequest) returns (CustomerResponse);
  
  // Aplica una baja logica al cliente (activo = false), no borramos registros fisicamente
  rpc DeactivateCustomer(GetCustomerRequest) returns (CustomerResponse);
  
  // Verifica si el cliente existe en la BD. Devuelve un booleano
  rpc CheckCustomerExists(GetCustomerRequest) returns (CheckCustomerExistsResponse);
  // Verifica si el cliente está habilitado para operar. Devuelve un booleano
  rpc IsCustomerActive(GetCustomerRequest) returns (IsCustomerActiveResponse);
}

// Roles de seguridad para el control de acceso en el Gateway
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_CLIENTE = 2;
}

// Entidad principal del cliente con su informacion de contacto y estado
message Customer {
  int32 id = 1;
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  string email = 5;
  string telefono = 6;
  bool activo = 7; // Controla si el cliente puede o no realizar nuevas reservas
  string fecha_nacimiento = 8; // Formato esperado: YYYY-MM-DD
}

message AuthenticateRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateResponse {
  string token = 1; // JWT para mantener la sesion
  int32 user_id = 2;
  string email = 3;
  Role rol = 4;
  optional int32 cliente_id = 5; // ID del cliente asociado
  string nombre = 6; // Nombre para mostrar en la barra de navegación del frontend
}

message ListCustomersRequest {
  bool solo_activos = 1; // Si es true, omite a los clientes dados de baja
}

message ListCustomersResponse {
  repeated Customer clientes = 1;
}

message GetCustomerRequest {
  int32 id = 1;
}

message CreateCustomerRequest {
  string documento = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string telefono = 5;
  string fecha_nacimiento = 6;
}

// Mensaje para modificar clientes
// Uso de 'optional': Si un campo no se envía, conserva su valor actual. Si se envía vacío (""), se blanquea
message UpdateCustomerRequest {
  int32 id = 1;
  optional string nombre = 2;
  optional string apellido = 3;
  optional string email = 4;
  optional string telefono = 5;
  optional bool activo = 6;
  optional string documento = 7;
  optional string fecha_nacimiento = 8;
}

message GetCustomerByDocumentRequest {
  string documento = 1;
}

message CustomerResponse {
  Customer cliente = 1;
}

message CheckCustomerExistsResponse {
  bool existe = 1;
}

message IsCustomerActiveResponse {
  bool activo = 1;
}