syntax = "proto3";

package rentar.vehicle.v1;

import "google/protobuf/timestamp.proto";

// Servicio que gestiona el catalogo y el ABM de la flota de vehículos
service VehicleService {
  // Devuelve la lista de vehiculos, se usa tanto en el catálogo (solo activos) como en el panel Admin (todos)
  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse);
  
  // Trae el detalle de un vehiculo por su ID
  rpc GetVehicle(GetVehicleRequest) returns (VehicleResponse);
  
  // Trae un vehiculo por su patente. Usado por la pantalla de creacion de reservas
  rpc GetVehicleByPlate(GetVehicleByPlateRequest) returns (VehicleResponse);
  
  // Motor de busqueda principal: evalua qué vehiculos estan libres en un rango de fechas especifico
  // Cruza datos con las reservas confirmadas para evitar solapamientos
  rpc CheckAvailability(CheckAvailabilityRequest) returns (ListVehiclesResponse);

  // Da de alta un nuevo auto en la flota
  rpc CreateVehicle(CreateVehicleRequest) returns (VehicleResponse);
  
  // Actualiza las caracteristicas o precio de un vehículo existente
  rpc UpdateVehicle(UpdateVehicleRequest) returns (VehicleResponse);
  
  // Baja logica del vehiculo. Lo oculta del catalogo pero mantiene su historial de reservas
  rpc DeactivateVehicle(DeactivateVehicleRequest) returns (VehicleResponse);

  // Modifica el estado operativo del vehiculo (ej: pasa de DISPONIBLE a EN_ALQUILER)
  rpc UpdateVehicleStatus(UpdateVehicleStatusRequest) returns (VehicleResponse);
}

// Categorias de vehiculos disponibles para filtrar en el catalogo
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_SEDAN = 1;
  VEHICLE_TYPE_SUV = 2;
  VEHICLE_TYPE_PICKUP = 3;
  VEHICLE_TYPE_COUPE = 4;
  VEHICLE_TYPE_HATCHBACK = 5;
}

// Maquina de estados operativa del vehiculo
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_DISPONIBLE = 1; // Listo para ser reservado
  VEHICLE_STATUS_RESERVADO = 2;  // Reservado a futuro
  VEHICLE_STATUS_EN_ALQUILER = 3; // Actualmente en uso por un cliente
}

// Entidad principal del vehiculo
message Vehicle {
  int32 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  VehicleType tipo_vehiculo = 7;
  int64 precio_diario_centavos = 8;
  VehicleStatus estado = 9;
  bool activo = 10;
}

// Parametros opcionales para acotar los resultados del catalogo
message VehicleFilter {
  VehicleType tipo_vehiculo = 1;
  string marca = 2;
  string modelo = 3;
  int64 precio_min_centavos = 4;
  int64 precio_max_centavos = 5;
}

message ListVehiclesRequest {
  bool solo_activos = 1;
}

message ListVehiclesResponse {
  repeated Vehicle vehiculos = 1;
}

message GetVehicleRequest {
  int32 id = 1;
}

message GetVehicleByPlateRequest {
  string patente = 1;
}

message CheckAvailabilityRequest {
  google.protobuf.Timestamp fecha_inicio = 1;
  google.protobuf.Timestamp fecha_fin = 2;
  VehicleFilter filtros = 3;
}

message CreateVehicleRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo_vehiculo = 6;
  int64 precio_diario_centavos = 7;
}

message UpdateVehicleRequest {
  int32 id = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo_vehiculo = 6;
  int64 precio_diario_centavos = 7;
  bool activo = 8;
}

message DeactivateVehicleRequest {
  int32 id = 1;
}

message UpdateVehicleStatusRequest {
  int32 id = 1;
  VehicleStatus estado = 2;
}

message VehicleResponse {
  Vehicle vehiculo = 1;
}