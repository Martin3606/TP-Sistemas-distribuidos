# Rentar - Hito 2 (microservicios). Reemplaza el docker-compose.yml de la raíz.
services:
  mysql-db:
    image: mysql:8.0
    container_name: rentar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"          # host:3307 -> contenedor:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # solo init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rentar-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"          # REST + GraphQL (/graphql)
    environment:
      - VEHICLE_GRPC_URL=vehicle-service:50051
      - CUSTOMER_GRPC_URL=customer-service:50052
      - RENTAL_GRPC_URL=rental-service:50053
    networks:
      - rentar-network
    depends_on:
      - vehicle-service
      - customer-service
      - rental-service

  vehicle-service:
    build:
      context: ./vehicle-service
    container_name: vehicle-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_vehiculos
      - GRPC_PORT=50051
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_clientes
      - GRPC_PORT=50052
      - JWT_SECRET=rentar_jwt_secret_key_1234567890_super_secret
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy

  rental-service:
    build:
      context: ./rental-service
    container_name: rental-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_alquileres
      - GRPC_PORT=50053
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy

networks:
  rentar-network:
    driver: bridge

volumes:
  db_data:
