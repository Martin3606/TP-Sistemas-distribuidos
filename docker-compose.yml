# Rentar - Hito 3 (microservicios y eventos)
# MySQL se publica en el puerto 3307 del host (el 3306 queda libre para un MySQL local).
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rentar-rabbitmq
    hostname: rentar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rentar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rentar_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rentar-network

  rabbitmq-topology-init:
    build:
      context: ./rabbitmq
    container_name: rentar-rabbitmq-topology-init
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rentar}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rentar_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - rentar-network

  mysql-db:
    image: mysql:8.0
    container_name: rentar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"          # host:3307 -> contenedor:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # solo init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rentar-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"          # REST + GraphQL (/graphql)
    environment:
      - VEHICLE_GRPC_URL=vehicle-service:50051
      - CUSTOMER_GRPC_URL=customer-service:50052
      - RENTAL_GRPC_URL=rental-service:50053
      - JWT_SECRET=rentar_jwt_secret_key_1234567890_super_secret
    networks:
      - rentar-network
    depends_on:
      - vehicle-service
      - customer-service
      - rental-service

  vehicle-service:
    build:
      context: ./vehicle-service
    container_name: vehicle-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_vehiculos
      - GRPC_PORT=50051
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-rentar}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rentar_dev}
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-topology-init:
        condition: service_completed_successfully

  verification-service:
    build:
      context: ./verification-service
    container_name: verification-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_vehiculos
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-rentar}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rentar_dev}
      - VERIFICATION_DELAY_SECONDS=${VERIFICATION_DELAY_SECONDS:-2}
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-topology-init:
        condition: service_completed_successfully

  maintenance-service:
    build:
      context: ./maintenance-service
    container_name: maintenance-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_mantenimiento
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-rentar}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rentar_dev}
      - MAINTENANCE_DELAY_SECONDS=3 # Para simular el tiempo de procesamiento
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-topology-init:
        condition: service_completed_successfully      

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_clientes
      - GRPC_PORT=50052
      - JWT_SECRET=rentar_jwt_secret_key_1234567890_super_secret
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy

  rental-service:
    build:
      context: ./rental-service
    container_name: rental-service
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_alquileres
      - GRPC_PORT=50053
      - APP_ZONE=America/Argentina/Buenos_Aires
    networks:
      - rentar-network
    depends_on:
      mysql-db:
        condition: service_healthy

networks:
  rentar-network:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data:
